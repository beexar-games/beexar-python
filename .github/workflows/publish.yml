# Publishes `beexar` to PyPI when GitLab pushes a release tag here.
#
# There is NO PyPI token, not even for the first upload: PyPI's PENDING
# PUBLISHER lets a trusted publisher be registered for a project that does not
# exist yet, and the first publish creates it. `id-token: write` below is what
# makes that work.
#
# The PyPI side is configured once, at
#   pypi.org -> Your projects -> Publishing -> Add a new pending publisher
#   owner: beexar-games · repository: beexar-python · workflow: publish.yml
#   environment: pypi · project name: beexar
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and the ceiling of what pyproject.toml claims to support.
        # Testing only the newest would let a 3.12-only construct ship to a
        # 3.9 user.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    # A named environment lets the trusted publisher be pinned to it, so a
    # workflow run outside this environment cannot publish.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
